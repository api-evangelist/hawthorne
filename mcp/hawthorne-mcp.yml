  service: dev.ucp.shopping
  schema: https://ucp.dev/2026-04-08/services/shopping/mcp.openrpc.json
tools:
- name: search_catalog
  description: Find products matching the buyer's intent (UCP dev.ucp.shopping.catalog.search).
  source: llms.txt agent flow
- name: create_cart
  description: Add desired items to a cart (UCP dev.ucp.shopping.cart).
  source: llms.txt agent flow
- name: create_checkout
