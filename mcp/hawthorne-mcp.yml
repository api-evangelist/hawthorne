notes: Live agent-commerce MCP endpoint exposed by the Hawthorne Shopify store via the Universal Commerce
  Protocol (UCP, https://ucp.dev). The endpoint requires a UCP agent-profile handshake; an unauthenticated
  tools/list returns "UCP discovery failed / Missing profile uri". Tool names below are taken verbatim
  from the store's published /llms.txt agent flow and the UCP capability set in the /.well-known/ucp profile
  — not fabricated. Checkout completion requires explicit human buyer approval; the endpoint is rate-limited
  per IP (back off on 429).
server:
  name: hawthorne-ucp-shopping
  transport: http
  protocol: mcp
  url: https://hawthorne-lab.myshopify.com/api/ucp/mcp
  ucp_version: '2026-04-08'
  ucp_supported_versions:
  - '2026-04-08'
