name: Hawthorne
description: >-
  Hawthorne is an internet-first men's personal care and grooming brand founded in
  2016 in New York City (a Techstars alum, later Series B). It sells personalized,
  long-lasting fragrance and grooming products — cologne, deodorant, body wash, face
  and hair care — tuned to a customer's body chemistry and lifestyle through an
  onboarding quiz and a smart-subscription model built around its "Surround Scent"
  technology. The direct-to-consumer storefront at hawthorne.co runs on Shopify and
  exposes a modern agent-commerce surface: a published /llms.txt and /agents.md,
  Shopify Customer Account OpenID Connect discovery, and a live Universal Commerce
  Protocol (UCP) MCP endpoint so AI shopping agents can search the catalog, build a
  cart, and complete a buyer-approved checkout.
